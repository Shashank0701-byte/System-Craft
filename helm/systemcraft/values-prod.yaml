# ──────────────────────────────────────────────────────────────
# Production environment overrides
# Usage: helm install systemcraft-prod ./helm/systemcraft -f helm/systemcraft/values-prod.yaml
# ──────────────────────────────────────────────────────────────

replicaCount: 3

image:
  # REQUIRED: CI/CD must override with --set image.tag=$SHA; never deploy unpinned
  tag: "0.1.0"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: system-craft-kohl.vercel.app
  tls:
    enabled: true
    secretName: system-craft-tls

resources:
  limits:
    cpu: "1000m"
    memory: "1Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  metrics:
    cpu:
      averageUtilization: 40
    memory:
      averageUtilization: 80

# ── Sealed Secrets (Bitnami) ────────────────────────────────
# Generate real values with:
#   kubectl create secret generic systemcraft-secrets \
#     --from-literal=mongodb-uri='...' \
#     --from-literal=openrouter-api-key='...' \
#     --from-literal=firebase-service-account-key='...' \
#     --dry-run=client -o yaml | kubeseal --format yaml
sealedSecrets:
  enabled: true
  encryptedData:
    mongodb-uri: "<kubeseal encrypted value>"
    openrouter-api-key: "<kubeseal encrypted value>"
    firebase-service-account-key: "<kubeseal encrypted value>"

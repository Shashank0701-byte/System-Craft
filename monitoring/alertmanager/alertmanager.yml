# ──────────────────────────────────────────────────────────────
# AlertManager Configuration for SystemCraft
# Routes alerts to Discord/Slack webhook and email.
# ──────────────────────────────────────────────────────────────

global:
  # How long to wait before sending a notification again for the same alert
  resolve_timeout: 5m

# ── Alert Routing ─────────────────────────────────────────────
route:
  # Group alerts by alertname so related alerts are batched together
  group_by: ['alertname', 'severity']

  # Wait 30s to batch alerts before sending the first notification
  group_wait: 30s

  # Wait 5 minutes before sending updates for an existing alert group
  group_interval: 5m

  # Wait 4 hours before resending a notification for the same alert
  repeat_interval: 4h

  # Default receiver for all alerts
  receiver: 'discord-webhook'

  # Route critical alerts with shorter repeat interval
  routes:
    - match:
        severity: critical
      receiver: 'discord-webhook'
      repeat_interval: 1h

# ── Receivers ─────────────────────────────────────────────────
receivers:
  # Discord webhook — receives all alerts as formatted messages
  # Replace the webhook_url with your actual Discord webhook URL
  - name: 'discord-webhook'
    discord_configs:
      - url: '${ALERTMANAGER_DISCORD_WEBHOOK_URL}'
        send_resolved: true

  # Uncomment to also send to Slack:
  # - name: 'slack-webhook'
  #   slack_configs:
  #     - api_url: '${ALERTMANAGER_SLACK_WEBHOOK_URL}'
  #       channel: '#systemcraft-alerts'
  #       send_resolved: true
  #       title: '{{ .GroupLabels.alertname }}'
  #       text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'

# ── Inhibition Rules ─────────────────────────────────────────
# Suppress warnings when a critical alert is already firing for the same group
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

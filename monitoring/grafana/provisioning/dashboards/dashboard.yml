# Grafana Dashboard Provisioning
# Loads JSON dashboards from the mounted volume on boot.

apiVersion: 1

providers:
  - name: 'SystemCraft'
    orgId: 1
    folder: 'SystemCraft'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

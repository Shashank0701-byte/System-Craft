name: SystemCraft CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Prevent concurrent deploy jobs from racing on manifest updates
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

  kubernetes-validate:
    name: K8s Manifest Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install kubeval
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/download/v0.16.1/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/kubeval

      - name: Validate K8s manifests
        env:
          KUBEVAL_SCHEMA_LOCATION: https://raw.githubusercontent.com/instrumenta/kubernetes-json-schema/master
        run: |
          kubeval --schema-location "$KUBEVAL_SCHEMA_LOCATION" kubernetes/deployment.yaml
          kubeval --schema-location "$KUBEVAL_SCHEMA_LOCATION" kubernetes/service.yaml
          kubeval --ignore-missing-schemas --schema-location "$KUBEVAL_SCHEMA_LOCATION" kubernetes/hpa.yaml
          kubeval --ignore-missing-schemas --schema-location "$KUBEVAL_SCHEMA_LOCATION" kubernetes/ingress.yaml

  build-test-publish:
    name: Build, Test & Publish Docker Image
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_APP_ID: "ci-placeholder"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build Docker image (load locally for scanning)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ env.REPO }}/systemcraft-web:latest
            ghcr.io/${{ env.REPO }}/systemcraft-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: 'ghcr.io/${{ env.REPO }}/systemcraft-web:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Start Redis for E2E
        run: docker run -d --name redis-e2e -p 6379:6379 redis:7-alpine

      - name: Start Docker Container
        run: |
          docker run -d --name systemcraft-e2e -p 3000:3000 \
            -e REDIS_URL=redis://host.docker.internal:6379 \
            ghcr.io/${{ env.REPO }}/systemcraft-web:${{ github.sha }}
          # Wait for container to be ready
          echo "Waiting for container to be ready on port 3000..."
          timeout 60 bash -c 'until curl -fsS http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          echo "Container is ready!"

      - name: Install dependencies (for Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Cleanup Docker Container
        if: always()
        run: |
          docker rm -f systemcraft-e2e || true
          docker rm -f redis-e2e || true

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ env.REPO }}/systemcraft-web:latest
          docker push ghcr.io/${{ env.REPO }}/systemcraft-web:${{ github.sha }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, kubernetes-validate, build-test-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Deployment for ArgoCD
        run: |
          # Replace the image tag with the current commit SHA
          sed -i "s|systemcraft-web:.*|systemcraft-web:${{ github.sha }}|g" kubernetes/deployment.yaml

          # Verify the replacement actually worked
          if ! grep -q "systemcraft-web:${{ github.sha }}" kubernetes/deployment.yaml; then
            echo "::error::sed replacement failed — deployment.yaml does not contain expected image tag"
            exit 1
          fi
          echo "✅ Image tag verified: systemcraft-web:${{ github.sha }}"

          # Configure git for the bot commit
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add kubernetes/deployment.yaml

          # Only commit and push if there are staged changes
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit — image tag already up to date"
            exit 0
          fi

          git commit -m "chore(cd): update image tag to ${{ github.sha }} [skip ci]"

          # Retry push with rebase to handle race conditions
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push; then
              echo "✅ Push succeeded on attempt $i"
              exit 0
            fi
            echo "⚠️  Push failed (attempt $i/$MAX_RETRIES), rebasing and retrying..."
            git pull --rebase origin main
          done

          echo "::error::Push failed after $MAX_RETRIES attempts"
          exit 1

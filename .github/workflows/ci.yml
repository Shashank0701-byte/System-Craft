name: SystemCraft CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Prevent concurrent deploy jobs from racing on manifest updates
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    env:
      # Minimal env vars needed for Next.js build (app won't auth in CI)
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_APP_ID: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, e2e-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build Docker image (load locally for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ env.REPO }}/systemcraft-web:latest
            ghcr.io/${{ env.REPO }}/systemcraft-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ghcr.io/${{ env.REPO }}/systemcraft-web:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ env.REPO }}/systemcraft-web:latest
          docker push ghcr.io/${{ env.REPO }}/systemcraft-web:${{ github.sha }}

  kubernetes-validate:
    name: K8s Manifest Check
    runs-on: ubuntu-latest
    needs: [docker-build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeval with local schemas
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/download/v0.16.1/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/kubeval
          wget -q https://github.com/instrumenta/kubernetes-json-schema/archive/refs/heads/master.zip
          unzip -q master.zip
          echo "SCHEMA_DIR=$(pwd)/kubernetes-json-schema-master" >> $GITHUB_ENV

      - name: Validate K8s manifests
        run: |
          kubeval --schema-location file://${SCHEMA_DIR} kubernetes/deployment.yaml
          kubeval --schema-location file://${SCHEMA_DIR} kubernetes/service.yaml
          kubeval --ignore-missing-schemas --schema-location file://${SCHEMA_DIR} kubernetes/hpa.yaml
          kubeval --ignore-missing-schemas kubernetes/ingress.yaml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [kubernetes-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Deployment for ArgoCD
        run: |
          # Replace the image tag with the current commit SHA
          sed -i "s|systemcraft-web:.*|systemcraft-web:${{ github.sha }}|g" kubernetes/deployment.yaml

          # Verify the replacement actually worked
          if ! grep -q "systemcraft-web:${{ github.sha }}" kubernetes/deployment.yaml; then
            echo "::error::sed replacement failed — deployment.yaml does not contain expected image tag"
            exit 1
          fi
          echo "✅ Image tag verified: systemcraft-web:${{ github.sha }}"

          # Configure git for the bot commit
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add kubernetes/deployment.yaml

          # Only commit and push if there are staged changes
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit — image tag already up to date"
            exit 0
          fi

          git commit -m "chore(cd): update image tag to ${{ github.sha }} [skip ci]"

          # Retry push with rebase to handle race conditions
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push; then
              echo "✅ Push succeeded on attempt $i"
              exit 0
            fi
            echo "⚠️  Push failed (attempt $i/$MAX_RETRIES), rebasing and retrying..."
            git pull --rebase origin main
          done

          echo "::error::Push failed after $MAX_RETRIES attempts"
          exit 1

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: systemcraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Shashank0701-byte/System-Craft.git'
    path: kubernetes
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

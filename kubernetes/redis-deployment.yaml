apiVersion: apps/v1
kind: Deployment
metadata:
  name: systemcraft-redis
  labels:
    app: systemcraft-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: systemcraft-redis
  template:
    metadata:
      labels:
        app: systemcraft-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            memory: "128Mi"
            cpu: "250m"
          requests:
            memory: "64Mi"
            cpu: "100m"

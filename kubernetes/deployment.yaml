apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-craft
  labels:
    app: system-craft
spec:
  replicas: 3
  selector:
    matchLabels:
      app: system-craft
  template:
    metadata:
      labels:
        app: system-craft
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: system-craft
        image: ghcr.io/shashank0701-byte/system-craft/systemcraft-web:12c57b84c2a9f773ba176adc5fb95011ffecc456
        ports:
        - name: http
          containerPort: 3000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: systemcraft-secrets
              key: mongodb-uri
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: systemcraft-secrets
              key: openrouter-api-key
        - name: FIREBASE_SERVICE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: systemcraft-secrets
              key: firebase-service-account-key
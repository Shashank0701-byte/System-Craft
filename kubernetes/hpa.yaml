apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: system-craft-hpa
  labels:
    app: system-craft
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: system-craft
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
